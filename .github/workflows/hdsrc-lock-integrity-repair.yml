name: HDSRC lock integrity repair

on:
  push:
    branches:
      - integration/hdsrc-mrmic-nvcl-v0.1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/hdsrc-mrmic-nvcl-v0.1
      - name: Repair exact pre-existing lock integrity value
        shell: python
        run: |
          from pathlib import Path
          path = Path('package-lock.json')
          text = path.read_text(encoding='utf-8')
          old = 'sha512-GInyZLjgWDfsVT6+SHxQVRwNzV0AuA1uqGsOAW+0th56J7NhKXHBWzUrihxMetcFDmQMAX1tZ1fZDYSRsw=='
          new = 'sha512-GInyZLjgWDfsVT6+SHxQVRwNzV0AuA1uqGsOAW+0th56J7Nh6bHHKXHBWzUrihxMetcFDmQMAX1tZ1fZDYSRsw=='
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit exact repair if needed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          git commit -m "fix: restore canonical resvg integrity metadata"
          git push origin HEAD:integration/hdsrc-mrmic-nvcl-v0.1
