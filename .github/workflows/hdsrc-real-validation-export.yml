name: HDSRC real validation export

on:
  push:
    branches:
      - validation/hdsrc-v010-real-20260828

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-artifact@v4
        with:
          name: hdsrc-real-validation-source
          path: |
            scripts/hdsrc_process_host.py
            scripts/hdsrc_runtime_adapter.py
            scripts/hdsrc_materialization_service.py
            scripts/validate_hdsrc_v010_bridge.py
            scripts/validate_hdsrc_v010_rebinding.py
