name: HDSRC v0.3 final real export

on:
  push:
    branches:
      - validation/hdsrc-v03-final-real-20260828

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: hdsrc-v03-final-real-built
          path: |
            dist
            scripts
            packages
            contracts
            package.json
            package-lock.json
            tsconfig.json
          include-hidden-files: false
          retention-days: 1
