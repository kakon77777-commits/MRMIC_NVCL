name: HDSRC v0.3 Task4 TS one-shot fix

on:
  push:
    branches:
      - integration/hdsrc-runtime-manager-v0.3

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: integration/hdsrc-runtime-manager-v0.3
          fetch-depth: 0
      - name: Apply exact TS narrowing fix and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages/provider-hdsrc/src/runtime-manager.ts')
          text = p.read_text(encoding='utf-8')
          first_old = """        await provider.capabilities()\n        if (this.#state === 'stopped') {\n"""
          first_new = """        await provider.capabilities()\n        if (this.status().state === 'stopped') {\n"""
          second_old = """      } catch (error) {\n        provider.close()\n        if (this.#state !== 'stopped') this.#state = 'degraded'\n"""
          second_new = """      } catch (error) {\n        provider.close()\n        if (this.status().state !== 'stopped') this.#state = 'degraded'\n"""
          if text.count(first_old) != 1:
              raise SystemExit('async start stop-check anchor mismatch')
          if text.count(second_old) != 1:
              raise SystemExit('async catch stop-check anchor mismatch')
          text = text.replace(first_old, first_new).replace(second_old, second_new)
          p.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/hdsrc-v03-task4-tsfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/provider-hdsrc/src/runtime-manager.ts
          git commit -m 'fix: preserve stop checks across async manager start'
          git push origin HEAD:integration/hdsrc-runtime-manager-v0.3
